        "acceptedAnswer": {
          "@type": "Answer",

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Under Section 27 of the Indian Contract Act, 1872, agreements in restraint of trade or lawful profession are void. Under the common law doctrine of quantum meruit, earned variable pay or performance incentives for completed evaluation quarters cannot be arbitrarily withheld simply because an employee served notice or resigned."
        }
      },

        "@type": "Question",
        "name": "What is the maximum Professional Tax an employer can deduct in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Under Article 276(2) of the Constitution of India, the total Professional Tax payable by any citizen to any State or municipal authority cannot exceed ₹2,500 per financial year. Any deduction beyond ₹2,500 per year is unconstitutional."
        }
      },
      {
        "@type": "Question",
        "name": "What is retrenchment compensation under Section 25F in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Under Section 25F of the Industrial Disputes Act, 1947, any workman who has been in continuous service for not less than one year (240 days) cannot be retrenched without one month notice in writing (or wages in lieu) and severance compensation equivalent to 15 days average pay for every completed year of continuous service."
        }
      },

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Minimum wages in India are state-specific and revised bi-annually with Variable Dearness Allowance (VDA). Delhi has among the highest at ₹783–₹1,035/day. Tamil Nadu rates are ₹480–₹900/day, Karnataka ₹535–₹918/day, and Maharashtra ₹551–₹950/day depending on skill tier."
        }
      },

        "@type": "Question",
        "name": "Is PF mandatory for all employees in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "PF (Provident Fund) is statutory mandatory under the EPF Act 1952 for employees earning ₹15,000 or less per month basic + DA in establishments with 20 or more workers. Both employer and employee contribute 12% of basic wages."
        }
      },
      {
        "@type": "Question",
        "name": "How is gratuity calculated in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Gratuity = (Last Drawn Basic Salary + DA) × (15 / 26) × Number of Completed Years of Service. Employees are entitled after completing 5 continuous years (or 4 years and 240 days under judicial precedent). Maximum tax-free gratuity is ₹20 lakhs."
        }
      },

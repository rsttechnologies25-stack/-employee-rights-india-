          "@type": "Answer",
          "text": "PF (Provident Fund) is mandatory for employees earning ₹15,000 or less per month basic salary in companies with 20+ employees. Both employer and employee contribute 12% of basic salary."
        }
      },
      {
        "@type": "Question",
        "name": "What is the notice period rule in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Notice period is typically 30–90 days as per your employment contract and state's Shops & Establishments Act. Employers must pay notice pay if they ask you to leave early."
        }
      },
      {
        "@type": "Question",
        "name": "How is gratuity calculated in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Gratuity = (Last Basic Salary + DA) × 15/26 × Number of Years of Service. You are eligible after 5 years of continuous service. The maximum tax-free gratuity is ₹20 lakhs."
        }
      },
      {
        "@type": "Question",
        "name": "Can an employer hold my salary in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Under the Payment of Wages Act, salary must be paid by the 7th of every month (small companies) or 10th (large companies). Withholding salary is illegal and you can file a complaint with the Labour Commissioner."
        }
      }
